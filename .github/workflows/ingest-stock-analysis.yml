name: Ingest Stock Analysis

# Claude 앱 예약 작업이 push 한 증시 분석 JSON(web/public/stock/{morning,afternoon}/날짜.json)을
# Supabase stock_analysis 테이블에 upsert 한다. 텔레그램 알림(send-routine)은 이 테이블을 읽는다.
on:
  push:
    branches: [main]
    paths:
      - 'web/public/stock/morning/**'
      - 'web/public/stock/afternoon/**'
  workflow_dispatch:
    inputs:
      files:
        description: '다시 적재할 파일 경로 (공백 구분, 비우면 최근 커밋 변경분)'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed analysis files
        id: files
        run: |
          if [ -n "${{ github.event.inputs.files }}" ]; then
            FILES="${{ github.event.inputs.files }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- web/public/stock/morning web/public/stock/afternoon 2>/dev/null \
                    || git diff --name-only HEAD~1 HEAD -- web/public/stock/morning web/public/stock/afternoon)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- web/public/stock/morning web/public/stock/afternoon)
          fi
          echo "files=$(echo $FILES | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "대상: $FILES"

      - name: Upsert into Supabase
        if: steps.files.outputs.files != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/stock_sync.py ingest ${{ steps.files.outputs.files }}
