name: Sync Watchlist

# 웹에서 설정한 관심 종목(Supabase stock_watchlist)을 data/stock/watchlist.json 으로 내보낸다.
# Claude 앱 예약 작업(증시 분석)이 이 파일을 읽어 분석 대상을 정한다.
on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분 (변경이 있을 때만 커밋)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-watchlist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export watchlist from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/stock_sync.py export-watchlist data/stock/watchlist.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stock/watchlist.json && git ls-files --error-unmatch data/stock/watchlist.json >/dev/null 2>&1; then
            echo "관심 종목 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock/watchlist.json
          git commit -m "data: 관심 종목 동기화"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
