name: Collect Stock Data

# 2026-10: 정기 분석은 Claude 앱 예약 작업으로 옮겼다 (ingest-stock-analysis.yml 참고).
# 같은 행을 덮어쓰지 않도록 자동 실행은 끄고, Claude 작업이 실패한 날의 수동 대체용으로만 남긴다.
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'morning or afternoon'
        required: true
        default: 'morning'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Determine type
        id: type
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
          else
            echo "type=morning" >> $GITHUB_OUTPUT
          fi

      - name: Call Edge Function
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.SUPABASE_FUNCTION_URL_STOCK }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"${{ steps.type.outputs.type }}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error: HTTP $HTTP_CODE"
            exit 1
          fi
